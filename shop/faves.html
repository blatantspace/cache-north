    </section>

    <div class="toolbar" style="position:sticky;top:52px;z-index:30;background:rgba(10,12,14,0.9);backdrop-filter:blur(14px);padding:0.65rem 1rem 0.85rem;border-bottom:1px solid rgba(197,204,211,0.08)">
      <div class="toolbar-row" style="display:flex;flex-wrap:nowrap;gap:0.45rem;overflow-x:auto;scrollbar-width:none">

    <div class="cn-mosaic" id="fave-list"></div>

    <p class="note" style="padding:0.75rem 1.25rem;font-size:0.65rem;color:var(--steel-dim)">
      Image mosaic · click a tile for the shop · ♡ to unfave.
      <span id="disk-sync-status" hidden></span>
    </p>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const LS_FAVES = "cacheNorth.shop.faves";
    const LS_FAVES_UPDATED = "cacheNorth.shop.favesUpdated";
    const LS_STATUS = "cacheNorth.shop.status";
    const FAVES_API = "/api/faves";
    const VALID = new Set(["idea", "promoted", "archived"]);

    let products = [];
    let themeFilter = "all";
    let lineageFilter = "all";
    let statusFilter = "all";
    let sortBy = "newest";
    let diskSyncOk = null;

    function isLocalHost() {
      const h = location.hostname;
      return h === "localhost" || h === "127.0.0.1" || h === "[::1]";
    }

    function setDiskSyncStatus(ok, detail) {
      diskSyncOk = ok;
      const el = document.getElementById("disk-sync-status");
      if (!el) return;
      if (!isLocalHost()) {
        el.hidden = true;
        return;
      }
      el.hidden = false;
      el.textContent = ok ? (detail || " · disk sync on") : " · disk sync off";
    }

    function coreFavesMap(map) {
      const out = {};
      Object.keys(map || {}).forEach((id) => {
        const entry = map[id];
        if (!entry || typeof entry !== "object") return;
        out[id] = {
          favedAt: entry.favedAt || new Date().toISOString(),
          note: typeof entry.note === "string" ? entry.note : ""
        };
      });
      return out;
    }

    function parseTs(s) {
      const t = Date.parse(s || "");
      return Number.isFinite(t) ? t : 0;
    }

    function mergeFaveMaps(a, b) {
      const out = { ...coreFavesMap(a) };
      Object.keys(coreFavesMap(b)).forEach((id) => {
        const other = b[id];
        if (!out[id]) {
          out[id] = other;
          return;
        }
        const cur = out[id];
        if (parseTs(other.favedAt) >= parseTs(cur.favedAt)) {
          out[id] = {
            favedAt: other.favedAt || cur.favedAt,
            note: (other.note && other.note.length) ? other.note : (cur.note || "")
          };
        } else if ((!cur.note || !cur.note.length) && other.note) {
          out[id] = { ...cur, note: other.note };
        }
      });
      return out;
    }

    async function pushFavesToDisk(map) {
      if (!isLocalHost()) return;
      try {
        const res = await fetch(FAVES_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ faves: coreFavesMap(map) })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data && data.updated) {
          localStorage.setItem(LS_FAVES_UPDATED, data.updated);
        } else {
          localStorage.setItem(LS_FAVES_UPDATED, new Date().toISOString());
        }
        setDiskSyncStatus(true);
      } catch (err) {
        console.warn("faves disk sync failed", err);
        setDiskSyncStatus(false);
      }
    }

    async function hydrateFavesFromDisk() {
      if (!isLocalHost()) return;
      try {
        const res = await fetch(FAVES_API, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const diskFaves = coreFavesMap((data && data.faves) || {});
        const diskUpdated = (data && data.updated) || "";
        const lsUpdated = localStorage.getItem(LS_FAVES_UPDATED) || "";
        const lsFaves = loadFaves();
        let merged;
        if (parseTs(diskUpdated) >= parseTs(lsUpdated) && Object.keys(diskFaves).length) {
          merged = mergeFaveMaps(diskFaves, lsFaves);
        } else if (Object.keys(diskFaves).length) {
          merged = mergeFaveMaps(lsFaves, diskFaves);
        } else {
          merged = lsFaves;
        }
        saveMap(LS_FAVES, merged);
        const newest = parseTs(diskUpdated) >= parseTs(lsUpdated) ? diskUpdated : (lsUpdated || diskUpdated);
        if (newest) localStorage.setItem(LS_FAVES_UPDATED, newest);
        setDiskSyncStatus(true);
        await pushFavesToDisk(merged);
      } catch (err) {
        console.warn("faves disk hydrate failed", err);
        setDiskSyncStatus(false);
      }
    }

    function loadMap(key) {
      try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; }
      catch { return {}; }
    }
    function saveMap(key, map) {
      localStorage.setItem(key, JSON.stringify(map));
    }

    function loadFaves() {
      const raw = loadMap(LS_FAVES);
      const out = {};
      Object.keys(raw).forEach((id) => {
        const entry = raw[id];
        if (entry === true || entry === 1) {
          out[id] = { favedAt: new Date().toISOString(), note: "" };
        } else if (entry && typeof entry === "object") {
          out[id] = {
            favedAt: entry.favedAt || new Date().toISOString(),
            note: typeof entry.note === "string" ? entry.note : ""
          };
        }
      });
      return out;
    }

    function saveFaves(map) {
      saveMap(LS_FAVES, map);
      localStorage.setItem(LS_FAVES_UPDATED, new Date().toISOString());
      refreshCount();
      pushFavesToDisk(map);
    }

    function isFaved(id) {
      return Object.prototype.hasOwnProperty.call(loadFaves(), id);
    }

    function toggleFave(id, on) {
      const map = loadFaves();
      if (on) {
        if (!map[id]) map[id] = { favedAt: new Date().toISOString(), note: "" };
      } else {
        delete map[id];
      }
      saveFaves(map);
    }

    function setNote(id, note) {
      const map = loadFaves();
      if (!map[id]) return;
      map[id].note = note;
      saveFaves(map);
    }

    function resolveStatus(p) {
      const map = loadMap(LS_STATUS);
      if (map[p.id] && VALID.has(map[p.id])) return map[p.id];
      return p.status || "idea";
    }

    function money(n) {
      return new Intl.NumberFormat("en-CA", {
        style: "currency",
        currency: "CAD",
        maximumFractionDigits: 0
      }).format(n);
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function refreshCount() {
      const n = Object.keys(loadFaves()).length;
      const el = document.getElementById("fave-count");
      if (el) el.textContent = String(n);
    }

    function lineageLabel(p) {
      const key = p.parentKeeper || (
        ["v4-021", "v4-027", "v4-034"].includes(p.id) ? p.id : null
      );
      if (key === "v4-021") return "021 Strap";
      if (key === "v4-027") return "027 Gaunt";
      if (key === "v4-034") return "034 Point";
      if (p.lineage && String(p.lineage).startsWith("v4-")) {
        return lineageLabel({ id: p.lineage, parentKeeper: p.lineage });
      }
      return "Earlier";
    }

    function lineageSortKey(p) {
      const key = p.parentKeeper || p.lineage || p.id || "";
      if (key === "v4-021" || p.id === "v4-021") return "1-021";
      if (key === "v4-027" || p.id === "v4-027") return "2-027";
      if (key === "v4-034" || p.id === "v4-034") return "3-034";
      return "9-" + (p.name || "");
    }

    function kitOf(p) {
      return String(p.kit || p.theme || "").toLowerCase();
    }

    function isNiche(p) {
      return p.section === "niche" || p.niche === true;
    }

    function isGumsole(p) {
      const id = String(p.id || "");
      return kitOf(p) === "gumsole" || id.startsWith("v7-gs") ||
        /gumsole/i.test(p.name || "") || /gumsole/i.test(p.sku || "");
    }

    function matchesTheme(p) {
      if (themeFilter === "all") return true;
      const theme = String(p.theme || "").toLowerCase();
      const kit = kitOf(p);
      if (themeFilter === "gaiters") {
        return theme === "gaiters" || kit === "gaiters" || !!p.gaiter;
      }
      if (themeFilter === "gumsole") {
        return isGumsole(p);
      }
      if (themeFilter === "boots") {
        return theme === "boots" || kit === "boots" || isGumsole(p);
      }
      return theme === themeFilter || kit === themeFilter;
    }

    function matchesLineage(p) {
      if (lineageFilter === "all") return true;
      const id = String(p.id || "");
      if (lineageFilter === "leather50") {
        return p.lineage === "leather50" || id.startsWith("v8-col-");
      }
      if (lineageFilter === "extras") {
        return (p.lineage === "extras") || id.startsWith("v6-") ||
          (id.startsWith("v7-") && !id.startsWith("v7-gs") &&
            (p.kit === "hat" || p.kit === "mask" || p.kit === "eyewear" ||
              p.kit === "protection" || p.kit === "skis" || p.theme === "hat" ||
              p.theme === "mask" || p.theme === "eyewear" || p.theme === "protection" ||
              p.theme === "skis"));
      }
      if (lineageFilter === "earlier") {
        return !p.parentKeeper && !id.startsWith("v5-") &&
          !id.startsWith("v6-") &&
          !id.startsWith("v7-") &&
          !id.startsWith("v8-") &&
          p.lineage !== "extras" &&
          p.lineage !== "leather50" &&
          !["v4-021", "v4-027", "v4-034"].includes(p.id);
      }
      if (p.id === lineageFilter) return true;
      return (p.parentKeeper || p.lineage) === lineageFilter;
    }

    function matchesStatus(p) {
      if (statusFilter === "all") return true;
      return p._status === statusFilter;
    }

    function formatFavedAt(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        return d.toLocaleString("en-CA", {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch { return iso; }
    }

    function rowHTML(p, i = 0) {
      const shapes = ["sq", "tall", "wide", "sq", "hero", "tall"];
      const shape = shapes[i % shapes.length];
      return `
        <article class="cn-tile ${shape}" data-id="${escapeHtml(p.id)}">
          <a class="cn-tile-media" href="./?sku=${encodeURIComponent(p.sku)}" style="display:block">
            <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy" />
          </a>
          <button type="button" class="cn-tile-heart on" data-unfave="${escapeHtml(p.id)}" aria-label="Unfave">♥</button>
          <div class="cn-tile-veil" aria-hidden="true">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="sub">${money(p.price)}</div>
          </div>
        </article>`;
    }

    function emptyHTML() {
      return `
        <div class="empty">
          <p>No faves yet. Wander Wear · Kit and heart what hits.</p>
          <a class="cn-btn" href="./">Browse the shop</a>
        </div>`;
    }

    function favedProducts() {
      const faves = loadFaves();
      return products
        .filter((p) => faves[p.id])
        .map((p) => ({
          ...p,
          _status: resolveStatus(p),
          _fave: faves[p.id]
        }));
    }

    function sortList(list) {
      const copy = list.slice();
      copy.sort((a, b) => {
        if (sortBy === "name") {
          return (a.name || "").localeCompare(b.name || "", "en-CA");
        }
        if (sortBy === "price-asc") return (a.price || 0) - (b.price || 0);
        if (sortBy === "price-desc") return (b.price || 0) - (a.price || 0);
        if (sortBy === "lineage") {
          const c = lineageSortKey(a).localeCompare(lineageSortKey(b), "en-CA");
          return c || (a.name || "").localeCompare(b.name || "", "en-CA");
        }
        if (sortBy === "theme") {
          const c = (a.theme || "").localeCompare(b.theme || "", "en-CA");
          return c || (a.name || "").localeCompare(b.name || "", "en-CA");
        }
        // newest faved
        const ta = Date.parse(a._fave.favedAt || 0) || 0;
        const tb = Date.parse(b._fave.favedAt || 0) || 0;
        return tb - ta;
      });
      return copy;
    }

    function render() {
      let list = favedProducts()
        .filter(matchesTheme)
        .filter(matchesLineage)
        .filter(matchesStatus);
      list = sortList(list);

      const root = document.getElementById("fave-list");
      const totalFaved = Object.keys(loadFaves()).length;
      document.getElementById("list-count").textContent = String(list.length);
      refreshCount();

      if (!totalFaved) {
        root.innerHTML = emptyHTML();
        return;
      }
      if (!list.length) {
        root.innerHTML = `<div class="empty"><p>Nothing in this filter. Loosen kit, lineage, or status.</p></div>`;
        return;
      }

      root.innerHTML = list.map((p, i) => rowHTML(p, i)).join("");
      bindRows(root);
    }

    function bindRows(root) {
      root.querySelectorAll("[data-unfave]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = el.getAttribute("data-unfave");
          toggleFave(id, false);
          toast("Unfaved");
          render();
        });
      });
    }

    function exportFaves() {
      const faves = loadFaves();
      const byId = Object.fromEntries(products.map((p) => [p.id, p]));
      const items = Object.keys(faves).map((id) => {
        const p = byId[id];
        const meta = faves[id];
        return {
          id,
          sku: p ? p.sku : null,
          name: p ? p.name : null,
          price: p ? p.price : null,
          currency: "CAD",
          theme: p ? p.theme : null,
          mash: p ? p.mash : null,
          lineage: p ? (p.parentKeeper || p.lineage || null) : null,
          image: p ? p.image : null,
          favedAt: meta.favedAt,
          note: meta.note || "",
          missingFromCatalog: !p
        };
      });
      items.sort((a, b) => Date.parse(b.favedAt || 0) - Date.parse(a.favedAt || 0));
      const blob = new Blob([JSON.stringify({
        project: "cache.north wear — personal faves",
        key: LS_FAVES,
        count: items.length,
        exportedAt: new Date().toISOString(),
        faves: items
      }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cache-north-faves-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast(items.length ? `Exported ${items.length} faves` : "Exported empty faves set");
    }

    function importFavesFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          let incoming = {};
          if (Array.isArray(data.faves)) {
            data.faves.forEach((item) => {
              if (!item || !item.id) return;
              incoming[item.id] = {
                favedAt: item.favedAt || new Date().toISOString(),
                note: typeof item.note === "string" ? item.note : ""
              };
            });
          } else if (data.faves && typeof data.faves === "object" && !Array.isArray(data.faves)) {
            incoming = data.faves;
          } else if (data && typeof data === "object" && !data.project) {
            incoming = data;
          } else {
            throw new Error("Unrecognized faves JSON shape");
          }
          const normalized = {};
          Object.keys(incoming).forEach((id) => {
            const entry = incoming[id];
            if (entry === true || entry === 1) {
              normalized[id] = { favedAt: new Date().toISOString(), note: "" };
            } else if (entry && typeof entry === "object") {
              normalized[id] = {
                favedAt: entry.favedAt || new Date().toISOString(),
                note: typeof entry.note === "string" ? entry.note : ""
              };
            }
          });
          const n = Object.keys(normalized).length;
          if (!n) {
            toast("Import empty · nothing to add");
            return;
          }
          const mode = prompt(
            `Import ${n} fave(s).\nType merge or replace`,
            "merge"
          );
          if (mode === null) {
            toast("Import cancelled");
            return;
          }
          const action = String(mode).trim().toLowerCase();
          if (action === "replace") {
            saveFaves(normalized);
            toast(`Replaced · ${n} faves`);
          } else {
            const current = loadFaves();
            Object.assign(current, normalized);
            saveFaves(current);
            toast(`Merged · ${Object.keys(current).length} faves`);
          }
          render();
        } catch (err) {
          toast("Import failed · bad JSON");
          console.error(err);
        }
      };
      reader.readAsText(file);
    }

    function clearFaves() {
      if (!confirm("Clear all personal faves? This cannot be undone (export first if you care).")) {
        return;
      }
      localStorage.removeItem(LS_FAVES);
      localStorage.setItem(LS_FAVES_UPDATED, new Date().toISOString());
      pushFavesToDisk({});
      toast("Faves cleared");
      render();
    }

    document.querySelectorAll("[data-theme]").forEach((chip) => {
      chip.addEventListener("click", () => {
        themeFilter = chip.getAttribute("data-theme");
        lineageFilter = "all";
        document.querySelectorAll("[data-theme]").forEach((c) =>
          c.classList.toggle("on", c === chip)
        );
        document.querySelectorAll("[data-lineage]").forEach((c) =>
          c.classList.remove("on")
        );
        render();
      });
    });
    document.querySelectorAll("[data-lineage]").forEach((chip) => {
      chip.addEventListener("click", () => {
        const next = chip.getAttribute("data-lineage");
        // Toggle −50 off when already active (no separate lineage All in this toolbar)
        if (lineageFilter === next) {
          lineageFilter = "all";
          chip.classList.remove("on");
        } else {
          lineageFilter = next;
          themeFilter = "all";
          document.querySelectorAll("[data-theme]").forEach((c) =>
            c.classList.toggle("on", c.getAttribute("data-theme") === "all")
          );
          document.querySelectorAll("[data-lineage]").forEach((c) =>
            c.classList.toggle("on", c === chip)
          );
        }
        render();
      });
    });
    document.querySelectorAll("[data-status]").forEach((chip) => {
      chip.addEventListener("click", () => {
        statusFilter = chip.getAttribute("data-status");
        document.querySelectorAll("[data-status]").forEach((c) =>
          c.classList.toggle("on", c === chip)
        );
        render();
      });
    });
    document.getElementById("sort-select").addEventListener("change", (e) => {
      sortBy = e.target.value;
      render();
    });
    document.getElementById("btn-export").addEventListener("click", exportFaves);
    document.getElementById("btn-import").addEventListener("click", () => {
      document.getElementById("import-file").click();
    });
    document.getElementById("import-file").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) importFavesFile(file);
      e.target.value = "";
    });
    document.getElementById("btn-clear").addEventListener("click", clearFaves);

    fetch("./catalog.json?v=20260914-everywhere")
      .then((r) => r.json())
      .then(async (data) => {
        products = (data.products || []).map((p) => ({
          ...p,
          kit: p.kit || p.theme || null
        }));
        await hydrateFavesFromDisk();
        render();
      })
      .catch(() => {
        document.getElementById("fave-list").innerHTML =
          `<div class="empty"><p>Could not load catalog.json</p></div>`;
      });
  </script>
</body>
</html>
